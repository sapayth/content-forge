# DESCRIPTION: Deploy Content Forge to the WordPress.org SVN repository.
# Triggered on push of a version tag (e.g. v1.6.0) that is on main. Deploys only after CI passes.

name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # Plugin Check's job requests it; on a tag push there is no PR to comment on.
      pull-requests: write

  deploy:
    name: Build and deploy
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the check below can see whether the tag is on main.
          fetch-depth: 0

      # main only takes reviewed, CI-passing PRs. A tag on any other commit could ship
      # code that never went through that, so refuse it before anything from the repo runs.
      - name: Verify the tag points at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Refusing to deploy."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Install npm dependencies
        run: npm ci

      - name: Read plugin version
        id: plugin_version
        run: |
          VERSION=$(grep -i "Version:" content-forge.php | head -1 | awk '{print $NF}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches plugin version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.plugin_version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version ${{ steps.plugin_version.outputs.version }}"
            exit 1
          fi

      - name: Build assets
        run: npm run build

      - name: Install production composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0 (stable)
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: content-forge
          VERSION: ${{ steps.plugin_version.outputs.version }}
