# DESCRIPTION: Weekly dependency update PRs for composer, npm and GitHub Actions.
# Updates are grouped per ecosystem to keep PR noise down; security fixes still arrive as soon as they're published.

version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: [ '*' ]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ '*' ]
